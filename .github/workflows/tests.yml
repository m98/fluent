name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }  # oldest supported version; newer images no longer ship it
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # Fluent uses only the standard library, so there is nothing to install.
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Answer-leak guard self-test
        run: python .claude/hooks/answer-leak-guard.py --selftest
      - name: Hook and plugin config are valid JSON
        run: python -c "import json, pathlib; [json.loads(pathlib.Path(p).read_text(encoding='utf-8')) for p in ('.claude/hooks/hooks.json', '.claude/settings.json', '.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]"
